<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#071824"/>
  <!-- LiDAR scan beam -->
  <polygon points="400,60 100,420 700,420" fill="rgba(0,180,216,0.06)"/>
  <line x1="400" y1="60" x2="250" y2="420" stroke="rgba(0,180,216,0.3)" stroke-width="1"/>
  <line x1="400" y1="60" x2="550" y2="420" stroke="rgba(0,180,216,0.3)" stroke-width="1"/>
  <!-- Point Cloud Dots -->
  <g fill="#00b4d8">
    <circle cx="200" cy="380" r="2.5"/><circle cx="230" cy="350" r="3"/><circle cx="260" cy="390" r="2.5"/><circle cx="290" cy="340" r="3"/>
    <circle cx="320" cy="370" r="2"/><circle cx="350" cy="330" r="3.5"/><circle cx="380" cy="360" r="2.5"/><circle cx="410" cy="320" r="3"/>
    <circle cx="440" cy="380" r="2"/><circle cx="470" cy="340" r="3"/><circle cx="500" cy="370" r="2.5"/><circle cx="530" cy="330" r="3.5"/>
    <circle cx="560" cy="390" r="2"/><circle cx="590" cy="350" r="3"/><circle cx="620" cy="380" r="2.5"/>
  </g>
  <g fill="#90e0ef">
    <circle cx="350" cy="250" r="2"/><circle cx="370" cy="230" r="2.5"/><circle cx="390" cy="260" r="2"/>
    <circle cx="410" cy="220" r="3"/><circle cx="430" cy="250" r="2.5"/><circle cx="450" cy="230" r="2"/>
  </g>
  <!-- 3D Bounding box -->
  <polygon points="330,220 470,200 490,260 350,280" fill="none" stroke="#90e0ef" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="400" y="450" fill="#ffffff" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">SPATIAL 3D POINT CLOUD MESH</text>
  <text x="400" y="475" fill="#90e0ef" font-family="sans-serif" font-size="14" text-anchor="middle">FIG.08 — LIDAR SCENE RECONSTRUCTION &amp; SURFACE NORMALS</text>
</svg>
