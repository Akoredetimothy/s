<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffcf8a" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#00a4ef" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00a4ef" stop-opacity="0"/>
